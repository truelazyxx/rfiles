<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Skybox & Textures Loader (.tex + .dds)</title>
</head>
<body>
<h1>Ładowanie plików .tex i .dds</h1>

<script>
(async () => {
    try {
        const res = await fetch('./files.json');
        const data = await res.json();

        ['skybox','textures'].forEach(folder => {
            data[folder].forEach(file => {
                fetch(`${folder}/${file}`)
                  .then(r => r.blob()) // pobieramy zawartość pliku jako blob
                  .then(blob => console.log(`Załadowano: ${folder}/${file}`, blob))
                  .catch(e => console.error('Błąd przy pliku:', file, e));
            });
        });

        console.log('Wszystkie pliki .tex i .dds zostały pobrane.');
    } catch(e) {
        console.error('Nie udało się załadować JSON', e);
    }
})();
</script>

</body>
</html>
